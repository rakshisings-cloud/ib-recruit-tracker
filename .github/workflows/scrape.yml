name: Scrape firm career pages

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      firm_id:
        description: "Only check watch targets belonging to this firm ID"
        required: false
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO_EMAILS: ${{ secrets.ALERT_TO_EMAILS }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
        run: |
          if [ -n "${{ inputs.firm_id }}" ]; then
            npx tsx scraper/index.ts --firm-id=${{ inputs.firm_id }}
          else
            npx tsx scraper/index.ts
          fi
